<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ouu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #2a2a2a 0%, #0d0d0d 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        .title {
            font-size: 4.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            margin-bottom: 3.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .card {
            position: relative;
            width: 320px;
            max-width: 90vw;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .buttons {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-radius: 4px;
            overflow: hidden;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            text-decoration: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: filter 0.2s ease, transform 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .btn-spotify {
            background-color: #1DB954;
            color: #000;
        }

        .btn-apple {
            background-color: #ffffff;
            color: #000;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .email {
            position: absolute;
            bottom: 40px;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            opacity: 0.75;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .email a {
            color: white;
            text-decoration: none;
        }

        .email a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 3.2rem;
                margin-bottom: 2.5rem;
            }
            .card {
                width: 280px;
            }
            .btn {
                padding: 9px 14px;
                font-size: 13px;
            }
            .email {
                font-size: 0.95rem;
                bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <h1 class="title">ouu</h1>

    <div class="card">
        <!-- ZMIEŃ ŚCIEŻKĘ DO SWOJEGO ZDJĘCIA -->
        <img src="photo.jpg" alt="ouu">

        <div class="buttons">
            <!-- Spotify -->
            <a href="https://open.spotify.com/artist/4vz4jCooBPCKus5hXOWYJU?si=eBxtw4lDSOi9KWYY-Yurpg" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn btn-spotify">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.092-.779-.198-.87-.614-.092-.422.198-.78.614-.87 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.198 1.065zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                </svg>
                Spotify

            <!-- Apple Music -->
            <a href="https://music.apple.com/us/artist/maaki/1816310030" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn btn-apple">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>

                Apple Music
            </a>
        </div>
    </div>

    <div class="email">
        <a href="mailto:maakifyuh@gmail.com">maakifyuh@gmail.com</a>
    </div>

</body>
</html>
